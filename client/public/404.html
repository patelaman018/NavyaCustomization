<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Navya Customization</title>
    <!--
      Single Page App fallback for GitHub Pages.
      GitHub Pages serves this file for any unknown path (e.g. a hard refresh on
      /NavyaCustomization/admin). It rewrites the URL into a query string and
      redirects to index.html, which restores the real path (see index.html).
      pathSegmentsToKeep = 1 because the app is served one level deep at
      /NavyaCustomization/. Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
